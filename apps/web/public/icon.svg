<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="foundersGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#020617" />
  <!-- Dual Interlocking Rings / Worlds -->
  <!-- Founders Circle -->
  <circle cx="210" cy="256" r="110" fill="none" stroke="url(#foundersGrad)" stroke-width="28" opacity="0.9" />
  <!-- Socializing Circle -->
  <circle cx="302" cy="256" r="110" fill="none" stroke="url(#socialGrad)" stroke-width="28" opacity="0.9" />
  <!-- Center Union Node -->
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
</svg>
