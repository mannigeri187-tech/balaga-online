services:
  - type: web
    name: balaga-online
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://balaga.online,https://www.balaga.online,https://balagaonline.vercel.app
      - key: CORS_ORIGIN
        value: https://balaga.online
      - key: ENABLE_DEV_MOCK_AUTH
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
